name: Portfolio Prototype Smoke Tests

on:
  push:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'docs/MODEL_IMPLEMENTATION_PLAN.md'
      - 'docs/DECISION_STUDIO_SPEC.md'
      - '.github/workflows/portfolio-smoke.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'docs/MODEL_IMPLEMENTATION_PLAN.md'
      - 'docs/DECISION_STUDIO_SPEC.md'
      - '.github/workflows/portfolio-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Numerical and portfolio tests
        run: node --test
